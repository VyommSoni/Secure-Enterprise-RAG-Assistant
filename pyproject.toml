[project]
name = "secure-enterprise-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vyomsoni", email = "svyom21@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.162.0",
    "langchain>=1.4.7",
    "langchain-core>=1.7.0",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "psycopg-pool>=3.3.3",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
secure-enterprise-rag = "secure_enterprise_rag:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
